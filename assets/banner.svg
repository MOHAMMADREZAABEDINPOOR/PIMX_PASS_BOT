<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="btBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" /><stop offset="50%" stop-color="#160c2c" /><stop offset="100%" stop-color="#070310" />
    </linearGradient>
    <linearGradient id="btNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"><animate attributeName="stop-color" values="#ef4444;#a855f7;#06b6d4;#ef4444" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#ec4899;#ef4444;#a855f7" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#06b6d4"><animate attributeName="stop-color" values="#06b6d4;#ef4444;#a855f7;#06b6d4" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="btGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" /><stop offset="100%" stop-color="#a855f7" stop-opacity="0.35" />
    </linearGradient>
    <filter id="btGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes btFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .floating-bot { animation: btFloat 5.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#btBg)" />

  <g opacity="0.6">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#ef4444" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#btGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="250" y2="360" stroke="url(#btGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="500" y2="360" stroke="url(#btGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="700" y2="360" stroke="url(#btGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="950" y2="360" stroke="url(#btGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#btGrid)" stroke-width="1.5" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <circle cx="200" cy="110" r="140" fill="#ef4444" opacity="0.08" filter="url(#btGlow)" />
  <circle cx="960" cy="170" r="160" fill="#a855f7" opacity="0.12" filter="url(#btGlow)" />

  <!-- 3D Isometric Bot Drone & Probe Telemetry -->
  <g transform="translate(940, 180)" class="floating-bot">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#btNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <!-- Robot Head Outline -->
    <rect x="-45" y="-45" width="90" height="75" rx="16" fill="#1b122e" stroke="#ef4444" stroke-width="2.5" filter="url(#btGlow)" opacity="0.9" />
    <!-- Visor Eye Screen -->
    <rect x="-32" y="-28" width="64" height="24" rx="8" fill="#080414" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="-14" cy="-16" r="5" fill="#06b6d4" />
    <circle cx="14" cy="-16" r="5" fill="#06b6d4" />
    <!-- Antenna -->
    <line x1="0" y1="-45" x2="0" y2="-65" stroke="#ef4444" stroke-width="2" />
    <circle cx="0" cy="-68" r="6" fill="#ef4444" filter="url(#btGlow)" />

    <!-- Inactive Badge -->
    <g transform="translate(-55, 45)">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
      <text x="55" y="16" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">🛑 ARCHIVED BOT</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="280" height="24" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#ef4444" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="2">ARCHIVED // TELEGRAM PROBE BOT</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#btNeon)" filter="url(#btGlow)" letter-spacing="3">
      PIMX_PASS_BOT
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ High-Concurrency Proxy Scanner, TMA Latency Benchmark &amp; Telegram Bot
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#180e28" stroke="#ef4444" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">🛑 Inactive Reference</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#180e28" stroke="#a855f7" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">⚡ 3-Stage Probe Engine</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#180e28" stroke="#06b6d4" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#22d3ee" text-anchor="middle">🤖 TMA Mini App</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#180e28" stroke="#34d399" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">🧪 21 Unit Tests</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#btNeon)" stroke-width="3" filter="url(#btGlow)" />
</svg>