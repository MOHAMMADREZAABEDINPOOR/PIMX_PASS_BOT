# Example nginx config to serve the bot mini-app at:
#   https://pimxpass.site/webapp
#
# Assumes:
# - nginx terminates TLS (valid certs via Let's Encrypt / Cloudflare, etc.)
# - the Python app listens privately on http://127.0.0.1:8080
#
# After enabling this, set:
#   PUBLIC_BASE_URL=https://pimxpass.site
#
# Optional hardening: block public access to port 8080 at firewall level.

server {
  listen 80;
  server_name pimxpass.site;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name pimxpass.site;

  # TLS (fill these in with your real cert paths)
  ssl_certificate     /etc/letsencrypt/live/pimxpass.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pimxpass.site/privkey.pem;

  # If you already have a website on /, keep your existing locations and only proxy these paths:
  location = /webapp { proxy_pass http://127.0.0.1:8080/webapp; }
  location = /app    { proxy_pass http://127.0.0.1:8080/app; }
  location = /       { proxy_pass http://127.0.0.1:8080/; }

  location /api/    { proxy_pass http://127.0.0.1:8080/api/; }
  location /static/ { proxy_pass http://127.0.0.1:8080/static/; }
  location /c/      { proxy_pass http://127.0.0.1:8080/c/; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

